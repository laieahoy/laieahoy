backend:
  name: git-gateway
  branch: main

media_folder: static/img
public_folder: /img

collections:
  - name: blog
    label: 博客
    folder: blog
    create: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - label: 标题
        name: title
        widget: string

      - label: 作者
        name: authors
        widget: list
        default: [yangshun]

      - label: 标签
        name: tags
        widget: list

      - label: 摘要
        name: description
        widget: text

      - label: 正文
        name: body
        widget: markdown